name: Cut release

on:
  workflow_dispatch:
    inputs:
      VERSION:
        description: 'Version to release (must match the Version header in civicrm-ux.php)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  cut-release:
    uses: agileware/ci-workflows/.github/workflows/wordpress-plugin-cut-release.yml@main
    with:
      VERSION: ${{ inputs.VERSION }}
      VERSION_FILE: civicrm-ux.php
      # vendor/sabre/*/bin hold command-line dev scripts that have no runtime purpose and are
      # reachable over the web on a client site (one fetches a URL and writes a PHP file), so they
      # are stripped from the release.
      EXCLUDE_PATHS: "tests .github CONTRIBUTING.md composer.json composer.lock .gitignore vendor/sabre/vobject/bin vendor/sabre/xml/bin vendor/sabre/uri/bin"
